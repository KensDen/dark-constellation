<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060e" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>DARK CONSTELLATION</title>
    <meta
      name="description"
      content="A turn-based space and drone cybersecurity strategy sim. Six turns of jamming, LiDAR spoofing, and supply-chain implants against your constellation."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DARK CONSTELLATION" />
    <meta
      property="og:description"
      content="A turn-based space and drone cybersecurity strategy sim. Every adversary threat maps to a published framework technique."
    />
    <meta property="og:url" content="https://kensden.github.io/dark-constellation/" />
    <meta property="og:image" content="https://kensden.github.io/dark-constellation/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DARK CONSTELLATION key art: a dark sphere split by a diagonal magenta beam, blue energy on one side and magenta on the other."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image:alt"
      content="DARK CONSTELLATION key art: a dark sphere split by a diagonal magenta beam, blue energy on one side and magenta on the other."
    />
    <!-- The wordmark's face, asked for with the page and not once the
         stylesheet is read: on a slow phone the title's first paint showed
         the wordmark in a fallback face and swapped it a second later. -->
    <link rel="preload" as="font" type="font/woff2" href="/src/ui/assets/fonts/display.woff2" crossorigin />
    <style>
      html {
        background-color: #05060e;
      }
      /* Before the game's script has run there is nothing to show. A page
         still dark after most of a second says it is loading, so a slow
         phone's first seconds do not read as a broken page; a fast load
         never shows it. The title replaces it. */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 600 12px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.3em;
        color: #8b98a8;
        opacity: 0;
        animation: boot 0.4s 0.8s forwards;
      }
      @keyframes boot {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><p class="boot">LOADING</p></div>
    <noscript><p style="margin: 40vh 24px 0; text-align: center; font: 14px system-ui, sans-serif; color: #e6edf3">DARK CONSTELLATION needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
